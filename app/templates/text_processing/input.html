{% extends "base.html" %}

{% block title %}
    .txt表示画面
{% endblock %}

{% block header %}
    {{ super() }}
    <div>
        <nav class="app-nav">
            <ul>
                <li>
                    <a href="{{ url_for('txt.new_line') }}" class="button txt">改行表示</a>
                </li>
                <li>
                    <a href="{{ url_for('txt.get_regex') }}" class="button txt">用語抽出</a>
                </li>
            </ul>
        </nav>
    </div>
{% endblock %}

{% block content %}
    <div>
        <p class="bs4-count-text">
            テキストファイルは
            <span>{{ character_count }}</span>
            文字です.
        </p>
    </div>
    <hr>
    <div>
        <p class="bs4-input-text">{{ file_content }}</p>
    </div>
{% endblock %}

{% block script %}{% endblock %}
